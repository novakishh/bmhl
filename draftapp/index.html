<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>BMHL - Live Draft</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://novakishh.github.io/bmhl/draftapp/">
  <meta property="og:title" content="BMHL - Live Draft Board">
  <meta property="og:description" content="Watch the BMHL draft live as captains make their picks!">
  <meta property="og:image" content="https://novakishh.github.io/bmhl/bmhl-preview.png">

  <!-- Google Fonts for Monogram -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-panel: #141414;
      --bg-card: #1f1f1f;
      --border-color: #333333;
      --accent-red: #d1122a;
      --accent-green: #28a745;
      --accent-yellow: #ffc107;
      --accent-blue: #007bff;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- SPLASH SCREEN INTRO ANIMATION --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      animation: splashContainerFade 0.6s cubic-bezier(0.7, 0, 0.3, 1) 3.4s forwards;
    }

    .bmhl-monogram {
      font-family: 'Anton', sans-serif;
      font-size: clamp(4.5rem, 16vw, 10rem);
      line-height: 0.8;
      color: #fff;
      letter-spacing: -4px; 
      transform: skewX(-12deg); 
      position: relative;
      text-shadow: 5px 5px 0px #d1122a, 10px 10px 0px #000;
      z-index: 2;
      display: flex;
      animation: monogramZoomThru 0.8s cubic-bezier(0.7, 0, 0.3, 1) 3.2s forwards;
    }

    .bmhl-monogram .letter {
      display: inline-block;
      opacity: 0;
      animation: iceCracken 0.7s cubic-bezier(0.1, 1.2, 0.3, 1) forwards;
    }

    .bmhl-monogram .letter:nth-child(1) { animation-delay: 0.20s; }
    .bmhl-monogram .letter:nth-child(2) { animation-delay: 0.60s; }
    .bmhl-monogram .letter:nth-child(3) { animation-delay: 1.00s; }
    .bmhl-monogram .letter:nth-child(4) { animation-delay: 1.40s; }

    .bmhl-monogram::after {
      content: '';
      position: absolute;
      bottom: 8px;
      right: -25px; 
      width: 90%;
      height: 20px;
      background-color: #d1122a;
      transform: skewX(45deg);
      box-shadow: 5px 5px 0px #000;
      z-index: -1;
      opacity: 0;
      animation: fadeIn 0.4s ease-out 1.80s forwards;
    }

    @keyframes iceCracken {
      0% {
        opacity: 0;
        transform: scale(2.5) translateY(-30px);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ZOOM IN THROUGH LOGO */
    @keyframes monogramZoomThru {
      0% {
        opacity: 1;
        transform: skewX(-12deg) scale(1);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: skewX(-12deg) scale(14);
        filter: blur(8px);
      }
    }

    @keyframes splashContainerFade {
      0% {
        opacity: 1;
        visibility: visible;
      }
      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* --- PAGE CONTENT FADE IN --- */
    .app-wrapper {
      opacity: 0;
      animation: appContentFadeIn 0.8s ease-out 3.3s forwards;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
    }

    @keyframes appContentFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* --- TOP HEADER BAR --- */
    .header-wrapper {
      background-color: #000000;
      border-bottom: 3px solid var(--accent-red);
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }
    .header-bar {
      max-width: 1280px; margin: 0 auto; padding: 10px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .header-controls { padding-top: 6px; border-top: 1px solid var(--border-color); }
    .status-badge { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .turn-display { font-size: 1.1rem; font-weight: 800; color: var(--accent-yellow); text-transform: uppercase; }
    .role-badge { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .role-badge.logged-in { color: var(--accent-green); }
    .btn-login { 
      background-color: var(--accent-red); 
      color: #ffffff; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 4px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      cursor: pointer; 
      text-transform: uppercase; 
    }
    .btn-login:hover { background-color: #ff1a35; }

    /* --- MOBILE TABS --- */
    .mobile-tabs {
      display: flex; background-color: #000000; border-bottom: 1px solid var(--border-color);
      position: sticky; top: 68px; z-index: 90;
    }
    .tab-btn { flex: 1; padding: 12px 5px; background: none; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--text-main); border-bottom-color: var(--accent-red); background-color: rgba(209, 18, 42, 0.15); }

    /* --- MAIN DRAFT LAYOUT --- */
    .main-wrapper {
      flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 16px;
      display: flex; flex-direction: column; position: relative;
    }
    .draft-container { display: flex; flex-direction: column; gap: 16px; width: 100%; flex: 1; }

    @media screen and (min-width: 768px), screen and (orientation: landscape) and (min-width: 568px) {
      .mobile-tabs { display: none; }
      body { height: 100vh; overflow: hidden; }
      .app-wrapper { height: 100vh; overflow: hidden; }
      .main-wrapper { flex: 1; overflow: hidden; height: auto; }
      .draft-container { flex-direction: row; gap: 16px; height: 100%; }
      .panel { display: flex !important; flex: 1; height: 100%; margin-bottom: 0 !important; }
      .panel.center-panel { flex: 1.3; }
    }

    .panel { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; margin-bottom: 16px; }
    @media screen and (max-width: 767px) and (orientation: portrait) { .panel { display: none; } .panel.active-tab { display: flex; } }
    .panel-title { font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .count-badge { background-color: var(--accent-red); color: #ffffff; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 700; }

    /* --- PRE-DRAFT LOBBY OVERLAY (TOP ALIGNED) --- */
    .lobby-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 10, 0.98); z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      gap: 16px; text-align: center; padding: 30px 20px;
      overflow-y: auto;
    }
    .lobby-title { font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 5px; }
    .ready-status-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; width: 100%; max-width: 350px; font-size: 1.1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .ready-status-box.is-ready { border-color: var(--accent-green); background-color: rgba(40, 167, 69, 0.1); }
    .status-icon { font-size: 1.5rem; }
    .btn-ready-up { background-color: var(--accent-red); color: #ffffff; font-size: 1.2rem; font-weight: 800; padding: 15px 30px; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; width: 100%; max-width: 350px; text-transform: uppercase; display: none; }
    .btn-ready-up:active { transform: scale(0.98); }

    /* --- PLAYER LISTS --- */
    .player-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; padding-right: 4px; }
    .player-card { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .type-tag { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background-color: #333333; color: #ffffff; text-transform: uppercase; }
    .player-card.goalie .type-tag { background-color: var(--accent-blue); color: #ffffff; }
    
    .interactive .player-card { cursor: pointer; border-color: var(--accent-red); }
    .interactive .player-card:hover { background-color: #2a2a2a; border-color: #ff1a35; }
    
    .roster-card { background-color: #1a1a1a; border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; display: flex; justify-content: space-between; }
    .pick-number { font-size: 0.75rem; color: var(--accent-red); font-weight: 700; }

    /* --- MODALS --- */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--bg-panel); padding: 20px; border-radius: 8px; border: 2px solid var(--accent-red); text-align: center; width: 100%; max-width: 320px; }
    .modal-content h3 { margin: 0 0 12px 0; font-size: 1.2rem; color: #ffffff; }
    .modal-input { width: 100%; padding: 12px; font-size: 1rem; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background-color: #000000; color: #ffffff; margin-bottom: 12px; }
    .btn-modal { width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 700; border-radius: 6px; border: none; color: #ffffff; cursor: pointer; margin-top: 6px; }
    .btn-confirm { background-color: var(--accent-red); }
    .btn-cancel { background-color: #333333; }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN INTRO ANIMATION -->
  <div id="splash-screen">
    <div class="bmhl-monogram">
      <span class="letter">B</span>
      <span class="letter">M</span>
      <span class="letter">H</span>
      <span class="letter">L</span>
    </div>
  </div>

  <!-- APP CONTENT WRAPPER -->
  <div class="app-wrapper">
    
    <!-- HEADER BAR -->
    <div class="header-wrapper">
      <div class="header-bar">
        <div class="header-row">
          <div class="status-badge" id="draft-status">CONNECTING...</div>
          <div class="turn-display" id="turn-display">LOADING</div>
        </div>
        <div class="header-row header-controls">
          <div class="role-badge" id="user-role-display">SPECTATOR MODE</div>
          <button class="btn-login" id="login-btn" onclick="openLogin()">UNLOCK DRAFT</button>
        </div>
      </div>
    </div>

    <!-- MOBILE TABS -->
    <div class="mobile-tabs">
      <button class="tab-btn active" id="tab-btn-avail" onclick="switchTab('available')">AVAILABLE (<span id="mobile-count-avail">0</span>)</button>
      <button class="tab-btn" id="tab-btn-team1" onclick="switchTab('team1')">TEAM 1</button>
      <button class="tab-btn" id="tab-btn-team2" onclick="switchTab('team2')">TEAM 2</button>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      
      <!-- PRE-DRAFT LOBBY OVERLAY -->
      <div id="lobby-overlay" class="lobby-overlay" style="display: none;">
        <div class="lobby-title">PRE-DRAFT LOBBY</div>
        <p style="color: var(--text-muted); margin-bottom: 10px;">Waiting for captains to ready up...</p>
        
        <div class="ready-status-box" id="lobby-box-c1">
          <span id="lobby-name-c1">CAPTAIN 1</span>
          <span class="status-icon" id="lobby-icon-c1">⏳</span>
        </div>
        
        <div class="ready-status-box" id="lobby-box-c2">
          <span id="lobby-name-c2">CAPTAIN 2</span>
          <span class="status-icon" id="lobby-icon-c2">⏳</span>
        </div>

        <button class="btn-ready-up" id="btn-ready-up" onclick="sendReadyUp()">I AM READY</button>
      </div>

      <!-- DRAFT BOARD -->
      <div class="draft-container">
        <div class="panel" id="panel-team1">
          <div class="panel-title"><span id="team1-title">TEAM 1</span><span class="count-badge" id="count-team1">0</span></div>
          <div class="player-list" id="team1-roster"></div>
        </div>
        <div class="panel center-panel active-tab" id="panel-available">
          <div class="panel-title"><span>AVAILABLE PLAYERS</span><span class="count-badge" id="count-avail">0</span></div>
          <div class="player-list" id="available-players"></div>
        </div>
        <div class="panel" id="panel-team2">
          <div class="panel-title"><span id="team2-title">TEAM 2</span><span class="count-badge" id="count-team2">0</span></div>
          <div class="player-list" id="team2-roster"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>UNLOCK DRAFT</h3>
      <select id="identity-select" class="modal-input">
        <option id="opt-cap1" value="cap1">Captain 1</option>
        <option id="opt-cap2" value="cap2">Captain 2</option>
      </select>
      <input type="password" id="pin-input" class="modal-input" placeholder="PIN (****)" inputmode="numeric" maxlength="4">
      <button class="btn-modal btn-confirm" onclick="verifyPin()">LOGIN</button>
      <button class="btn-modal btn-cancel" onclick="closeModal('login-modal')">CANCEL</button>
    </div>
  </div>

  <!-- CONFIRM PICK MODAL -->
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>CONFIRM PICK</h3>
      <p style="margin: 15px 0; font-size: 1.1rem; color: #ffffff;">Draft <strong id="confirm-player-name" style="color:var(--accent-red);"></strong>?</p>
      <button class="btn-modal btn-confirm" onclick="submitPick()">YES, DRAFT</button>
      <button class="btn-modal btn-cancel" onclick="closeModal('confirm-modal')">CANCEL</button>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyIOR9a1TsTk-NsxccwZdgNxmOPu_w7YWge9aEovUxCFXzWif3xsDQuLfT1DDbklQVm8g/exec';
    
    // --- PIN SETTINGS ---
    const CAP1_PIN = "1111"; 
    const CAP2_PIN = "2222"; 

    let isUnlocked = false;
    let myIdentity = "Spectator";
    let pendingPick = null;
    let draftState = { players: [], settings: { cap1: "Team 1", cap2: "Team 2", turn: "", status: "WAITING", cap1Ready: false, cap2Ready: false } };

    // Remove splash screen overlay after full extended animation completes
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) splash.style.display = 'none';
    }, 4100);

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-tab'));
      if (tab === 'available') { document.getElementById('tab-btn-avail').classList.add('active'); document.getElementById('panel-available').classList.add('active-tab'); } 
      else if (tab === 'team1') { document.getElementById('tab-btn-team1').classList.add('active'); document.getElementById('panel-team1').classList.add('active-tab'); } 
      else if (tab === 'team2') { document.getElementById('tab-btn-team2').classList.add('active'); document.getElementById('panel-team2').classList.add('active-tab'); }
    }

    async function fetchDraftData() {
      try {
        const response = await fetch(scriptURL + "?api=draft");
        const data = await response.json();
        if (!data.error) {
          draftState = data;
          renderDraftBoard();
        }
      } catch (err) { console.error("Fetch failed", err); }
    }

    fetchDraftData();
    setInterval(fetchDraftData, 3000);

    function renderDraftBoard() {
      const cap1 = draftState.settings.cap1 || "Team 1";
      const cap2 = draftState.settings.cap2 || "Team 2";
      
      document.getElementById('opt-cap1').value = cap1; document.getElementById('opt-cap1').innerText = cap1.toUpperCase();
      document.getElementById('opt-cap2').value = cap2; document.getElementById('opt-cap2').innerText = cap2.toUpperCase();
      
      document.getElementById('team1-title').innerText = cap1.toUpperCase();
      document.getElementById('team2-title').innerText = cap2.toUpperCase();
      document.getElementById('tab-btn-team1').innerText = cap1.toUpperCase();
      document.getElementById('tab-btn-team2').innerText = cap2.toUpperCase();

      // --- LOBBY LOGIC ---
      const lobbyOverlay = document.getElementById('lobby-overlay');
      if (draftState.settings.status !== "LIVE") {
        lobbyOverlay.style.display = "flex";
        document.getElementById('draft-status').innerText = "PRE-DRAFT LOBBY";
        document.getElementById('turn-display').innerText = "WAITING ON CAPTAINS";

        document.getElementById('lobby-name-c1').innerText = cap1.toUpperCase();
        document.getElementById('lobby-name-c2').innerText = cap2.toUpperCase();
        
        document.getElementById('lobby-icon-c1').innerText = draftState.settings.cap1Ready ? "✅" : "⏳";
        document.getElementById('lobby-box-c1').className = draftState.settings.cap1Ready ? "ready-status-box is-ready" : "ready-status-box";
        
        document.getElementById('lobby-icon-c2').innerText = draftState.settings.cap2Ready ? "✅" : "⏳";
        document.getElementById('lobby-box-c2').className = draftState.settings.cap2Ready ? "ready-status-box is-ready" : "ready-status-box";

        const btnReady = document.getElementById('btn-ready-up');
        if (isUnlocked && myIdentity === cap1 && !draftState.settings.cap1Ready) {
          btnReady.style.display = "block";
        } else if (isUnlocked && myIdentity === cap2 && !draftState.settings.cap2Ready) {
          btnReady.style.display = "block";
        } else {
          btnReady.style.display = "none";
        }
      } else {
        // LIVE DRAFT
        lobbyOverlay.style.display = "none";
        document.getElementById('draft-status').innerText = "🔴 LIVE DRAFT";
        
        let turnText = draftState.settings.turn ? draftState.settings.turn.toUpperCase() + "'S TURN" : "WAITING";
        if (isUnlocked) {
          if (draftState.settings.turn === myIdentity) {
            turnText = "👉 YOUR TURN";
            document.getElementById('turn-display').style.color = "var(--accent-green)";
          } else {
            document.getElementById('turn-display').style.color = "var(--accent-yellow)";
          }
        }
        document.getElementById('turn-display').innerText = turnText;
      }

      // --- RENDER PLAYERS ---
      const availableContainer = document.getElementById('available-players');
      const team1Container = document.getElementById('team1-roster');
      const team2Container = document.getElementById('team2-roster');

      availableContainer.innerHTML = ""; team1Container.innerHTML = ""; team2Container.innerHTML = "";
      
      let isMyTurn = false;
      if (isUnlocked && draftState.settings.status === "LIVE" && myIdentity === draftState.settings.turn) {
        isMyTurn = true;
      }

      if (isMyTurn) document.getElementById('panel-available').classList.add('interactive');
      else document.getElementById('panel-available').classList.remove('interactive');

      let countAvail = 0, countT1 = 0, countT2 = 0;

      let sortedPlayers = draftState.players.sort((a, b) => {
        if (a.type.toLowerCase() === 'goalie' && b.type.toLowerCase() !== 'goalie') return -1;
        if (a.type.toLowerCase() !== 'goalie' && b.type.toLowerCase() === 'goalie') return 1;
        return a.name.localeCompare(b.name);
      });

      sortedPlayers.forEach(p => {
        if (!p.draftedBy) {
          countAvail++;
          let card = document.createElement('div');
          card.className = `player-card ${p.type.toLowerCase() === 'goalie' ? 'goalie' : ''}`;
          card.innerHTML = `<span>${p.name}</span><span class="type-tag">${p.type}</span>`;
          if (isMyTurn) card.onclick = () => openConfirmModal(p.name);
          availableContainer.appendChild(card);
        } else {
          let rosterCard = document.createElement('div');
          rosterCard.className = 'roster-card';
          rosterCard.innerHTML = `<span>${p.name}</span> <span class="pick-number">#${p.pickNum}</span>`;
          if (p.draftedBy.toLowerCase() === cap1.toLowerCase()) { countT1++; team1Container.appendChild(rosterCard); } 
          else if (p.draftedBy.toLowerCase() === cap2.toLowerCase()) { countT2++; team2Container.appendChild(rosterCard); }
        }
      });

      document.getElementById('count-avail').innerText = countAvail;
      document.getElementById('mobile-count-avail').innerText = countAvail;
      document.getElementById('count-team1').innerText = countT1;
      document.getElementById('count-team2').innerText = countT2;
    }

    // --- API CALLS ---
    async function sendReadyUp() {
      document.getElementById('btn-ready-up').innerText = "CONFIRMING...";
      const payload = { secretToken: "BanhMiHockey2026!", type: "readyUp", captain: myIdentity };
      try {
        await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" } });
        await fetchDraftData();
      } catch (err) { alert("Error sending ready status."); document.getElementById('btn-ready-up').innerText = "I AM READY"; }
    }

    async function submitPick() {
      if (!pendingPick) return;
      const payload = { secretToken: "BanhMiHockey2026!", type: "draftPick", player: pendingPick, captain: draftState.settings.turn };
      try {
        await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" } });
        await fetchDraftData();
        closeModal('confirm-modal');
        pendingPick = null;
      } catch (err) { alert("Error making pick. Please try again."); closeModal('confirm-modal'); }
    }

    // --- UTILS ---
    function openLogin() { if (!isUnlocked) { document.getElementById('pin-input').value = ""; document.getElementById('login-modal').style.display = 'flex'; } }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function verifyPin() {
      const pin = document.getElementById('pin-input').value.trim();
      const selectedIdentity = document.getElementById('identity-select').value;
      const cap1Name = draftState.settings.cap1 || "cap1";
      const cap2Name = draftState.settings.cap2 || "cap2";

      let isValid = false;
      if (selectedIdentity === cap1Name && pin === CAP1_PIN) isValid = true;
      else if (selectedIdentity === cap2Name && pin === CAP2_PIN) isValid = true;

      if (isValid) {
        isUnlocked = true; myIdentity = selectedIdentity;
        closeModal('login-modal');
        document.getElementById('login-btn').style.display = 'none';
        
        const roleDisplay = document.getElementById('user-role-display');
        roleDisplay.innerText = `LOGGED IN AS: ${myIdentity.toUpperCase()}`;
        roleDisplay.classList.add('logged-in');
        renderDraftBoard(); 
      } else { alert("Incorrect PIN for selected Captain."); }
    }
  </script>
</body>
</html>
