<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>BMHL - Banh Mi Hockey League</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://novakishh.github.io/bmhl/">
  <meta property="og:title" content="BMHL - Banh Mi Hockey League">
  <meta property="og:description" content="Stats, standings, and game recaps for the BMHL. It's in the game!">
  <meta property="og:image" content="https://novakishh.github.io/bmhl/bmhl-preview.png">
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- PWA / FULL SCREEN APP META TAGS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BMHL Ref">
  <link rel="apple-touch-icon" href="bmhl-icon.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

    body {
      background-color: #111;
      color: white;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none; 
      -webkit-user-select: none;
      overscroll-behavior-y: none; 
    }

    /* --- TOP BAR: PERIOD & TIMER --- */
    .top-bar {
      background-color: #000;
      border-bottom: 4px solid #d1122a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      padding-top: max(env(safe-area-inset-top), 15px);
      flex-shrink: 0;
      z-index: 100;
    }

    .period-controls {
      display: flex !important;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 8px;
      width: 100%;
    }

    .timer-wrapper {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 5px 0;
    }

    .btn-small {
      background-color: #333;
      color: #fff;
      border: 2px solid #555;
      border-radius: 8px;
      font-size: 1.2rem;
      font-family: 'Anton', sans-serif;
      padding: 5px 15px;
      touch-action: manipulation;
      transition: opacity 0.2s;
    }

    .btn-small:active { background-color: #d1122a; border-color: #fff; }

    #period-display {
      font-family: 'Anton', sans-serif;
      font-size: 2.2rem;
      color: #d1122a;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      min-width: 140px;
    }

    .timer-display {
      font-family: 'Anton', sans-serif;
      font-size: 4.5rem;
      line-height: 1;
      letter-spacing: 2px;
    }

    .timer-controls {
      display: flex;
      gap: 15px;
    }

    .btn-timer {
      background-color: #d1122a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      padding: 10px 30px;
      touch-action: manipulation;
    }
    
    .btn-timer:active { background-color: #fff; color: #d1122a; }

    /* SHOOTOUT END GAME BUTTON */
    .btn-end-game {
      background-color: #d1122a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.8rem;
      padding: 12px 40px;
      margin-top: 10px;
      display: none; 
      touch-action: manipulation;
    }

    /* --- TEAM SCORING ZONES --- */
    .scoring-area {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .team-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .white-team { background-color: #fff; color: #000; }
    .black-team { background-color: #000; color: #fff; border-top: 4px solid #333; }

    .team-name {
      font-family: 'Anton', sans-serif;
      font-size: 2.5rem;
      margin: 0;
      text-transform: uppercase;
      position: absolute;
      top: 10px;
      left: 15px;
    }

    .score {
      font-family: 'Anton', sans-serif;
      font-size: 8rem;
      line-height: 1;
      margin-top: 0px; 
    }

    .score-controls {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .btn-score {
      border: none;
      border-radius: 12px;
      font-family: 'Anton', sans-serif;
      font-size: 3rem;
      width: 80px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .btn-minus { background-color: #555; color: #fff; opacity: 0.8; }
    .btn-plus { background-color: #28a745; color: #fff; width: 120px; }

    .white-team .btn-minus { background-color: #ccc; color: #000; }
    
    .btn-score:active { transform: scale(0.95); opacity: 1; }

    /* --- FULL SCREEN SHOOTOUT MODE --- */
    .shootout-container {
      display: none; 
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .so-ticker {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
      max-width: 90%;
    }

    .so-circle {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 4px solid #555;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Anton', sans-serif;
      font-size: 2.2rem;
      color: white;
      background-color: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .white-team .so-circle { border-color: #888; color: #000; }
    .black-team .so-circle { border-color: #555; color: #fff; }

    .so-goal { background-color: #28a745 !important; border-color: #28a745 !important; color: #fff !important; }
    .so-miss { background-color: #d1122a !important; border-color: #d1122a !important; color: #fff !important; }

    .so-add-btn {
      background-color: transparent;
      border: 2px solid #555;
      color: #888;
      font-size: 1.1rem;
      padding: 8px 20px;
    }

    .white-team .so-add-btn { border-color: #aaa; color: #444; }

    /* --- UNOBTRUSIVE FOOTER --- */
    .footer-bar {
      background-color: #1a1a1a;
      border-top: 2px solid #333;
      padding: 12px 15px;
      padding-bottom: calc(env(safe-area-inset-bottom, 15px) + 12px);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      font-family: 'Anton', sans-serif;
      font-size: 1rem;
      color: #666;
    }
    
    .display-val {
      color: #aaa;
      margin-left: 5px;
    }

    /* --- MODAL POPUPS --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: #111;
      padding: 30px 20px;
      border-radius: 15px;
      border: 2px solid #333;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .modal-content h2 {
      font-family: 'Anton', sans-serif;
      color: #fff;
      font-size: 2.5rem;
      margin: 0 0 10px 0;
    }

    .modal-content p {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }

    .btn-modal {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      border-radius: 8px;
      border: none;
      color: white;
      touch-action: manipulation;
    }

    .btn-ot { background-color: #ff9800; color: #000; }
    .btn-so { background-color: #9c27b0; }
    .btn-final { background-color: #d1122a; }

    /* SHOOTOUT CHOICE POPUP */
    .so-choice-box {
      background: #111;
      padding: 25px 20px;
      border-radius: 15px;
      border: 2px solid #444;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .so-choice-buttons {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: center;
    }

    .btn-so-choice {
      flex: 1;
      height: 80px;
      border-radius: 12px;
      border: none;
      font-family: 'Anton', sans-serif;
      font-size: 3rem;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .btn-so-goal { background-color: #28a745; }
    .btn-so-miss { background-color: #d1122a; }
    .btn-so-clear { 
      background-color: #444; 
      color: #ccc; 
      font-size: 1.2rem; 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: none;
      font-family: 'Anton', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="period-controls">
      <button class="btn-small" id="period-minus-btn" onclick="changePeriod(-1)">-</button>
      <div id="period-display">PERIOD 1</div>
      <button class="btn-small" id="period-plus-btn" onclick="changePeriod(1)">+</button>
    </div>
    
    <!-- STANDARD TIMER ELEMENTS -->
    <div class="timer-wrapper" id="timer-wrapper-section">
      <button class="btn-small" id="time-minus-btn" onclick="adjustTime(-1)">-</button>
      <div class="timer-display" id="time-display">20:00</div>
      <button class="btn-small" id="time-plus-btn" onclick="adjustTime(1)">+</button>
    </div>
    
    <div class="timer-controls" id="timer-controls-section">
      <button class="btn-timer" id="start-stop-btn" onclick="toggleTimer()">START</button>
      <button class="btn-small" id="reset-btn" onclick="resetTimer()" style="margin-left: 10px;">RESET</button>
    </div>

    <!-- SHOOTOUT END GAME BUTTON -->
    <button class="btn-end-game" id="so-end-btn" onclick="endShootoutGame()">END GAME</button>
  </div>

  <!-- SCORING ZONES -->
  <div class="scoring-area">
    
    <!-- WHITE TEAM -->
    <div class="team-card white-team">
      <h2 class="team-name">WHITE</h2>

      <!-- STANDARD SCORE -->
      <div class="score" id="white-score">0</div>
      <div class="score-controls" id="white-score-controls">
        <button class="btn-score btn-minus" onclick="changeScore('white', -1)">-</button>
        <button class="btn-score btn-plus" onclick="changeScore('white', 1)">+</button>
      </div>

      <!-- FULL SHOOTOUT TICKER VIEW -->
      <div class="shootout-container" id="white-so-container">
        <div class="so-ticker" id="white-ticker">
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
        </div>
        <button class="btn-small so-add-btn" onclick="addShooter('white')">+ SHOOTER</button>
      </div>
    </div>

    <!-- BLACK TEAM -->
    <div class="team-card black-team">
      <h2 class="team-name">BLACK</h2>

      <!-- STANDARD SCORE -->
      <div class="score" id="black-score">0</div>
      <div class="score-controls" id="black-score-controls">
        <button class="btn-score btn-minus" onclick="changeScore('black', -1)">-</button>
        <button class="btn-score btn-plus" onclick="changeScore('black', 1)">+</button>
      </div>

      <!-- FULL SHOOTOUT TICKER VIEW -->
      <div class="shootout-container" id="black-so-container">
        <div class="so-ticker" id="black-ticker">
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
        </div>
        <button class="btn-small so-add-btn" onclick="addShooter('black')">+ SHOOTER</button>
      </div>
    </div>

  </div>

  <!-- UNOBTRUSIVE FOOTER -->
  <div class="footer-bar">
    <div>BMHL REF COMPANION</div>
    <div>S<span class="display-val" id="season-display"></span> : G<span class="display-val" id="game-display"></span></div>
  </div>

  <!-- END OF REGULATION POPUP -->
  <div id="end-game-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>END OF REGULATION</h2>
      <p>Is this game going to Overtime, a Shootout, or is it Final?</p>
      <button class="btn-modal btn-ot" onclick="setPostGame('OT')">OVERTIME</button>
      <button class="btn-modal btn-so" onclick="setPostGame('SO')">SHOOTOUT</button>
      <button class="btn-modal btn-final" onclick="setPostGame('FINAL')">GAME OVER</button>
    </div>
  </div>

  <!-- SHOOTOUT CHOICE POPUP -->
  <div id="so-choice-modal" class="modal-overlay">
    <div class="so-choice-box">
      <div class="so-choice-buttons">
        <button class="btn-so-choice btn-so-goal" onclick="applySoChoice('goal')">✓</button>
        <button class="btn-so-choice btn-so-miss" onclick="applySoChoice('miss')">X</button>
      </div>
      <button class="btn-so-clear" onclick="applySoChoice('clear')">CLEAR CIRCLE</button>
    </div>
  </div>

  <script>
    // --- YOUR GOOGLE SCRIPT URL ---
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyIOR9a1TsTk-NsxccwZdgNxmOPu_w7YWge9aEovUxCFXzWif3xsDQuLfT1DDbklQVm8g/exec';

    // --- STATE VARIABLES ---
    let goalEvents = [];       
    let pendingSyncGoals = []; 
    let currentPeriod = 1;
    let activeSoCircle = null;
    
    let startingMinutes = 20; 
    let totalSeconds = startingMinutes * 60; 
    let timerInterval = null;
    let isRunning = false;

    // --- AUTO-CALCULATE SEASON & GAME ---
    let autoSeason = 5;
    let autoGame = 8;
    
    function calculateGameNumber() {
      const refDate = new Date(2026, 6, 24); 
      const now = new Date();
      const diffTime = now.getTime() - refDate.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays > 0) {
        autoGame = 8 + Math.floor(diffDays / 7);
      }
      
      document.getElementById('season-display').innerText = autoSeason;
      document.getElementById('game-display').innerText = autoGame;
    }

    calculateGameNumber();

    // --- SCORE & SILENT SYNC LOGIC ---
    function changeScore(team, amount) {
      if (amount === 1) {
        let newGoal = {
          id: Date.now(),
          team: team,
          period: currentPeriod,
          time: document.getElementById('time-display').innerText
        };
        
        goalEvents.push(newGoal);
        pendingSyncGoals.push(newGoal);

        setTimeout(() => {
          triggerSilentSync(newGoal.id);
        }, 30000); 

      } else if (amount === -1) {
        for (let i = goalEvents.length - 1; i >= 0; i--) {
          if (goalEvents[i].team === team) {
            let removedGoal = goalEvents.splice(i, 1)[0];
            pendingSyncGoals = pendingSyncGoals.filter(g => g.id !== removedGoal.id);
            break;
          }
        }
      }
      
      let whiteScore = goalEvents.filter(e => e.team === 'white').length;
      let blackScore = goalEvents.filter(e => e.team === 'black').length;
      
      document.getElementById('white-score').innerText = whiteScore;
      document.getElementById('black-score').innerText = blackScore;
    }

    function triggerSilentSync(goalId) {
      const goalIndex = pendingSyncGoals.findIndex(g => g.id === goalId);
      
      if (goalIndex > -1) {
        const goalToSync = pendingSyncGoals.splice(goalIndex, 1)[0];

        const payload = {
          secretToken: "BanhMiHockey2026!",
          season: autoSeason,
          game: autoGame,
          events: [goalToSync] 
        };

        fetch(scriptURL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          }
        })
        .then(response => console.log("Goal synced silently to Google Sheets!"))
        .catch(error => console.error("Sync failed:", error));
      }
    }

    // --- PERIOD LOGIC ---
    function changePeriod(amount) {
      if (isRunning) return;
      currentPeriod += amount;
      if (currentPeriod < 1) currentPeriod = 1;
      if (currentPeriod > 6) currentPeriod = 6;
      
      let display = "PERIOD " + currentPeriod;
      if (currentPeriod === 4) display = "OVERTIME";
      if (currentPeriod === 5) display = "SHOOTOUT";
      if (currentPeriod === 6) display = "FINAL";
      
      document.getElementById('period-display').innerText = display;
      updateShootoutUI();
    }

    function setPostGame(choice) {
      document.getElementById('end-game-modal').style.display = 'none';
      
      if (choice === 'OT') {
        currentPeriod = 4;
        document.getElementById('period-display').innerText = "OVERTIME";
        startingMinutes = 5; 
      } else if (choice === 'SO') {
        currentPeriod = 5;
        document.getElementById('period-display').innerText = "SHOOTOUT";
        startingMinutes = 0; 
      } else if (choice === 'FINAL') {
        currentPeriod = 6;
        document.getElementById('period-display').innerText = "FINAL";
        startingMinutes = 0; 
      }
      
      totalSeconds = startingMinutes * 60;
      updateTimerDisplay();
      updateShootoutUI();
    }

    // --- SHOOTOUT TICKER POPUP LOGIC ---
    function openSoChoice(el) {
      activeSoCircle = el;
      document.getElementById('so-choice-modal').style.display = 'flex';
    }

    function applySoChoice(result) {
      if (!activeSoCircle) return;

      activeSoCircle.classList.remove('so-goal', 'so-miss');
      activeSoCircle.innerText = "";

      if (result === 'goal') {
        activeSoCircle.classList.add('so-goal');
        activeSoCircle.innerText = "✓";
      } else if (result === 'miss') {
        activeSoCircle.classList.add('so-miss');
        activeSoCircle.innerText = "X";
      }

      document.getElementById('so-choice-modal').style.display = 'none';
      activeSoCircle = null;
    }

    function addShooter(team) {
      const ticker = document.getElementById(team + '-ticker');
      const newCircle = document.createElement('div');
      newCircle.className = 'so-circle';
      newCircle.onclick = function() { openSoChoice(this); };
      ticker.appendChild(newCircle);
    }

    function updateShootoutUI() {
      const isShootout = (currentPeriod === 5);
      
      // Hide/Show Standard Scoreboard vs Shootout Screens
      document.getElementById('white-score').style.display = isShootout ? 'none' : 'block';
      document.getElementById('white-score-controls').style.display = isShootout ? 'none' : 'flex';
      document.getElementById('black-score').style.display = isShootout ? 'none' : 'block';
      document.getElementById('black-score-controls').style.display = isShootout ? 'none' : 'flex';

      document.getElementById('white-so-container').style.display = isShootout ? 'flex' : 'none';
      document.getElementById('black-so-container').style.display = isShootout ? 'flex' : 'none';

      // Hide/Show Timer vs End Game Button
      document.getElementById('timer-wrapper-section').style.display = isShootout ? 'none' : 'flex';
      document.getElementById('timer-controls-section').style.display = isShootout ? 'none' : 'flex';
      document.getElementById('so-end-btn').style.display = isShootout ? 'block' : 'none';
    }

    function endShootoutGame() {
      let shootoutEvents = [];
      let whiteGoals = 0;
      let blackGoals = 0;

      // 1. Read White Shooters
      const whiteCircles = document.querySelectorAll('#white-ticker .so-circle');
      whiteCircles.forEach((c, idx) => {
        if (c.classList.contains('so-goal') || c.classList.contains('so-miss')) {
          const isGoal = c.classList.contains('so-goal');
          if (isGoal) whiteGoals++;
          shootoutEvents.push({
            shooter: "WHITE",
            goalie: "BLACK",
            time: "SO Shot " + (idx + 1),
            score: isGoal ? "GOAL" : "MISS"
          });
        }
      });

      // 2. Read Black Shooters
      const blackCircles = document.querySelectorAll('#black-ticker .so-circle');
      blackCircles.forEach((c, idx) => {
        if (c.classList.contains('so-goal') || c.classList.contains('so-miss')) {
          const isGoal = c.classList.contains('so-goal');
          if (isGoal) blackGoals++;
          shootoutEvents.push({
            shooter: "BLACK",
            goalie: "WHITE",
            time: "SO Shot " + (idx + 1),
            score: isGoal ? "GOAL" : "MISS"
          });
        }
      });

      // 3. Send Shootout Detailed Log to Columns AC:AG
      if (shootoutEvents.length > 0) {
        fetch(scriptURL, {
          method: 'POST',
          body: JSON.stringify({
            secretToken: "BanhMiHockey2026!",
            type: "shootout",
            game: autoGame,
            shootoutEvents: shootoutEvents
          }),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });
      }

      // 4. Award Official Game-Winning Goal (+1 to winning team)
      if (whiteGoals > blackGoals) {
        changeScore('white', 1);
      } else if (blackGoals > whiteGoals) {
        changeScore('black', 1);
      }

      // 5. Change Period to FINAL
      currentPeriod = 6;
      document.getElementById('period-display').innerText = "FINAL";
      updateShootoutUI();
    }

    // --- TIMER LOGIC ---
    function updateTimerDisplay() {
      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;
      let displayString = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
      document.getElementById('time-display').innerText = displayString;
    }
    
    function adjustTime(amount) {
      if (isRunning) return;
      startingMinutes += amount;
      if (startingMinutes < 1) startingMinutes = 1;
      if (startingMinutes > 60) startingMinutes = 60;
      totalSeconds = startingMinutes * 60;
      updateTimerDisplay();
    }

    function toggleTimer() {
      const btn = document.getElementById('start-stop-btn');
      const setupBtns = [
        document.getElementById('reset-btn'),
        document.getElementById('period-minus-btn'),
        document.getElementById('period-plus-btn'),
        document.getElementById('time-minus-btn'),
        document.getElementById('time-plus-btn')
      ];
      
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.innerText = "START";
        btn.style.backgroundColor = "#28a745"; 
        setupBtns.forEach(el => el.style.opacity = "1");
      } else {
        isRunning = true;
        btn.innerText = "PAUSE";
        btn.style.backgroundColor = "#d1122a"; 
        setupBtns.forEach(el => el.style.opacity = "0.3");
        
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();
          } else {
            // --- TIMER HITS 00:00 ---
            clearInterval(timerInterval);
            isRunning = false;
            
            btn.innerText = "START";
            btn.style.backgroundColor = "#28a745";
            setupBtns.forEach(el => el.style.opacity = "1"); 

            // Pop modal after Period 3. Otherwise auto-advance periods.
            if (currentPeriod === 3) {
              document.getElementById('end-game-modal').style.display = 'flex';
            } else if (currentPeriod < 3) {
              changePeriod(1);
              resetTimer();
            }
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (isRunning) return;
      clearInterval(timerInterval);
      isRunning = false;
      totalSeconds = startingMinutes * 60; 
      const btn = document.getElementById('start-stop-btn');
      btn.innerText = "START";
      btn.style.backgroundColor = "#28a745";
      updateTimerDisplay();
    }

    // Synchronize UI display state on startup
    updateShootoutUI();
  </script>
</body>
</html>
