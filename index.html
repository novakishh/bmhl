<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>BMHL - Stats Central</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://novakishh.github.io/bmhl/">
  <meta property="og:title" content="BMHL - Stats Central">
  <meta property="og:description" content="Stats, standings, and game recaps for the BMHL. It's in the game!">
  <meta property="og:image" content="https://novakishh.github.io/bmhl/bmhl-preview.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Dedicated Top Navbar (Prevents Overlapping Content) */
    .top-navbar {
      background-color: #000000;
      border-bottom: 2px solid #d1122a;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 46px;
      flex-shrink: 0;
      z-index: 100;
    }

    .brand-logo {
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .btn-draft-link {
      background-color: #d1122a;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      transition: background-color 0.15s;
    }

    .btn-draft-link:hover {
      background-color: #32a850;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 46px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- DEDICATED TOP HEADER -->
  <div class="top-navbar">
    <span class="brand-logo">BMHL STATS</span>
    <a href="./draftapp/" class="btn-draft-link">🔴 LIVE DRAFT BOARD</a>
  </div>

  <!-- IFRAME CONTAINER -->
  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbyIOR9a1TsTk-NsxccwZdgNxmOPu_w7YWge9aEovUxCFXzWif3xsDQuLfT1DDbklQVm8g/exec" 
      allow="geolocation; microphone; camera"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>
  </div>

</body>
</html>
