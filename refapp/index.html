<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>BMHL - Ref Companion App</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://novakishh.github.io/bmhl/refapp/">
  <meta property="og:title" content="BMHL - Ref Companion App">
  <meta property="og:description" content="Official Referee Companion App for the Banh Mi Hockey League.">
  <meta property="og:image" content="https://novakishh.github.io/bmhl/bmhl-preview.png">

  <!-- PWA / FULL SCREEN APP META TAGS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BMHL Ref">
  <link rel="apple-touch-icon" href="https://novakishh.github.io/bmhl/bmhl-icon.png">
  <link rel="icon" href="https://novakishh.github.io/bmhl/favicon.ico" type="image/x-icon">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

    body {
      background-color: #111;
      color: white;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none; 
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior-y: none; 
    }

    /* --- TOP BAR: PERIOD & TIMER --- */
    .top-bar {
      background-color: #000;
      border-bottom: 4px solid #d1122a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      padding-top: max(env(safe-area-inset-top), 15px);
      flex-shrink: 0;
      z-index: 100;
    }

    .period-controls {
      display: flex !important;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 8px;
      width: 100%;
    }

    .timer-wrapper {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 5px 0;
    }

    .btn-small {
      background-color: #333;
      color: #fff;
      border: 2px solid #555;
      border-radius: 8px;
      font-size: 1.2rem;
      font-family: 'Anton', sans-serif;
      padding: 5px 15px;
      touch-action: manipulation;
      transition: opacity 0.2s;
    }

    .btn-small:active { background-color: #d1122a; border-color: #fff; }

    #period-display {
      font-family: 'Anton', sans-serif;
      font-size: 2.2rem;
      color: #d1122a;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      min-width: 140px;
    }

    .timer-display {
      font-family: 'Anton', sans-serif;
      font-size: 4.5rem;
      line-height: 1;
      letter-spacing: 2px;
    }

    .timer-controls {
      display: flex;
      gap: 15px;
    }

    .btn-timer {
      background-color: #d1122a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      padding: 10px 30px;
      touch-action: manipulation;
    }
    .btn-timer:active { background-color: #fff; color: #d1122a; }

    .btn-end-period {
      background-color: #ff9800;
      color: #000;
      border: none;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.2rem;
      padding: 10px 15px;
      touch-action: manipulation;
    }
    .btn-end-period:active { background-color: #fff; }

    /* SHOOTOUT END GAME BUTTON */
    .btn-end-game {
      background-color: #d1122a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.8rem;
      padding: 12px 40px;
      margin-top: 10px;
      display: none; 
      touch-action: manipulation;
    }

    /* --- TEAM SCORING ZONES (MODULAR) --- */
    .scoring-area {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .team-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .white-team { background-color: #fff; color: #000; }
    .black-team { background-color: #000; color: #fff; border-top: 4px solid #333; }

    .score-box {
      background-color: #222;
      border: 4px solid #555;
      border-radius: 20px;
      width: 200px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      touch-action: manipulation;
    }
    
    .score-box:active { transform: scale(0.96); background-color: #333; }

    .score {
      font-family: 'Anton', sans-serif;
      font-size: 8rem;
      line-height: 1;
      color: #fff;
    }

    /* --- FULL SCREEN SHOOTOUT MODE --- */
    .shootout-container {
      display: none; 
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .so-ticker {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
      max-width: 90%;
    }

    .so-circle {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 4px solid #555;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Anton', sans-serif;
      font-size: 2.2rem;
      color: white;
      background-color: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .white-team .so-circle { border-color: #888; color: #000; }
    .black-team .so-circle { border-color: #555; color: #fff; }

    .so-goal { background-color: #28a745 !important; border-color: #28a745 !important; color: #fff !important; }
    .so-miss { background-color: #d1122a !important; border-color: #d1122a !important; color: #fff !important; }

    .so-add-btn {
      background-color: transparent;
      border: 2px solid #555;
      color: #888;
      font-size: 1.1rem;
      padding: 8px 20px;
    }
    .white-team .so-add-btn { border-color: #aaa; color: #444; }

    /* --- UNOBTRUSIVE FOOTER --- */
    .footer-bar {
      background-color: #1a1a1a;
      border-top: 2px solid #333;
      padding: 12px 15px;
      padding-bottom: calc(env(safe-area-inset-bottom, 15px) + 12px);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Anton', sans-serif;
      font-size: 1rem;
      color: #666;
    }

    .mode-toggle {
      background-color: #ffc107;
      color: #000;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      font-family: 'Anton', sans-serif;
      font-size: 1.1rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mode-live { background-color: #d1122a; color: #fff; }
    
    .display-val { color: #aaa; margin-left: 5px; }

    /* --- MODAL POPUPS --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: #111;
      padding: 30px 20px;
      border-radius: 15px;
      border: 2px solid #333;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .modal-content h2 {
      font-family: 'Anton', sans-serif;
      color: #fff;
      font-size: 2.5rem;
      margin: 0 0 10px 0;
    }

    .modal-content p {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }

    .btn-modal {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      border-radius: 8px;
      border: none;
      color: white;
      touch-action: manipulation;
    }

    .btn-ot { background-color: #ff9800; color: #000; }
    .btn-so { background-color: #9c27b0; }
    .btn-final { background-color: #d1122a; }
    .btn-cancel { background-color: #444; margin-top: 20px;}
    .btn-score-up { background-color: #28a745; }

    /* SHOOTOUT CHOICE POPUP */
    .so-choice-box {
      background: #111;
      padding: 25px 20px;
      border-radius: 15px;
      border: 2px solid #444;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .so-choice-buttons {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: center;
    }

    .btn-so-choice {
      flex: 1;
      height: 80px;
      border-radius: 12px;
      border: none;
      font-family: 'Anton', sans-serif;
      font-size: 3rem;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .btn-so-goal { background-color: #28a745; }
    .btn-so-miss { background-color: #d1122a; }
    .btn-so-clear { 
      background-color: #444; 
      color: #ccc; 
      font-size: 1.2rem; 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: none;
      font-family: 'Anton', sans-serif;
      touch-action: manipulation;
    }

    /* --- RESPONSIVE LANDSCAPE MODE (SIDEBAR LAYOUT) --- */
    @media screen and (orientation: landscape) {
      body {
        display: grid;
        grid-template-columns: 260px 1fr; /* Slightly thinner sidebar */
        grid-template-rows: 1fr auto;
        grid-template-areas:
          "sidebar scoring"
          "footer  scoring";
      }

      /* 1. Top Bar / Main Sidebar Area */
      .top-bar {
        grid-area: sidebar;
        border-bottom: none;
        border-right: 4px solid #d1122a;
        justify-content: center;
        padding: 5px 10px;
        padding-top: max(env(safe-area-inset-top), 10px);
      }

      /* 2. Footer Area (Protected from iOS Home Bar) */
      .footer-bar {
        grid-area: footer;
        border-top: none;
        border-right: 4px solid #d1122a;
        background-color: #000;
        flex-direction: column;
        justify-content: center;
        gap: 8px; /* Tighter gap */
        padding: 10px;
        /* CRITICAL: Pushes the yellow button up above the iPhone home bar */
        padding-bottom: max(env(safe-area-inset-bottom, 15px), 15px); 
      }

      /* 3. Tighter sizing for fonts and buttons to fit short screen heights */
      #period-display { font-size: 1.5rem; }
      .period-controls { margin-bottom: 2px; }
      .btn-small { padding: 4px 12px; font-size: 1rem; }
      
      .timer-display { font-size: 3.5rem; line-height: 1; }
      .timer-wrapper { margin: 5px 0; }
      
      .timer-controls {
        flex-direction: column;
        width: 80%;
        gap: 6px;
      }
      .timer-controls button {
        margin-left: 0 !important;
        width: 100%;
        margin-bottom: 0;
        padding: 8px 10px;
        font-size: 1.1rem;
      }

      .mode-toggle { font-size: 1rem; padding: 6px 12px; }

      /* 4. Scoreboard Zones */
      .scoring-area {
        grid-area: scoring;
        flex-direction: row;
      }
      .team-card {
        height: 100%;
        border-top: none;
      }
      .black-team {
        border-left: 4px solid #333;
        border-top: none;
      }

      .score-box {
        width: 220px;
        height: 180px;
      }
      .score {
        font-size: 9rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="period-controls">
      <button class="btn-small" id="period-minus-btn" onclick="changePeriod(-1)">-</button>
      <div id="period-display">PERIOD 1</div>
      <button class="btn-small" id="period-plus-btn" onclick="changePeriod(1)">+</button>
    </div>
    
    <!-- STANDARD TIMER ELEMENTS -->
    <div class="timer-wrapper" id="timer-wrapper-section">
      <button class="btn-small" id="time-minus-btn" onclick="adjustTime(-1)">-</button>
      <div class="timer-display" id="time-display">20:00</div>
      <button class="btn-small" id="time-plus-btn" onclick="adjustTime(1)">+</button>
    </div>
    
    <div class="timer-controls" id="timer-controls-section">
      <button class="btn-timer" id="start-stop-btn" onclick="toggleTimer()">START</button>
      <button class="btn-small" id="reset-btn" onclick="resetTimer()" style="margin-left: 10px;">RESET</button>
      <button class="btn-end-period" id="end-period-btn" onclick="handlePeriodEnd()" style="margin-left: 10px;">END PERIOD</button>
    </div>

    <!-- SHOOTOUT END GAME BUTTON -->
    <button class="btn-end-game" id="so-end-btn" onclick="endShootoutGame()">END GAME</button>
  </div>

  <!-- SCORING ZONES -->
  <div class="scoring-area">
    
    <!-- WHITE TEAM -->
    <div class="team-card white-team">
      <!-- STANDARD SCORE (LONG PRESS TRIGGER) -->
      <div class="score-box" id="white-score-box"
           onmousedown="startPress(event, 'white')" 
           onmouseup="cancelPress()" 
           onmouseleave="cancelPress()" 
           ontouchstart="startPress(event, 'white')" 
           ontouchend="cancelPress()">
        <span class="score" id="white-score">0</span>
      </div>

      <!-- FULL SHOOTOUT TICKER VIEW -->
      <div class="shootout-container" id="white-so-container">
        <div class="so-ticker" id="white-ticker">
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
        </div>
        <button class="btn-small so-add-btn" onclick="addShooter('white')">+ SHOOTER</button>
      </div>
    </div>

    <!-- BLACK TEAM -->
    <div class="team-card black-team">
      <!-- STANDARD SCORE (LONG PRESS TRIGGER) -->
      <div class="score-box" id="black-score-box"
           onmousedown="startPress(event, 'black')" 
           onmouseup="cancelPress()" 
           onmouseleave="cancelPress()" 
           ontouchstart="startPress(event, 'black')" 
           ontouchend="cancelPress()">
        <span class="score" id="black-score">0</span>
      </div>

      <!-- FULL SHOOTOUT TICKER VIEW -->
      <div class="shootout-container" id="black-so-container">
        <div class="so-ticker" id="black-ticker">
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
          <div class="so-circle" onclick="openSoChoice(this)"></div>
        </div>
        <button class="btn-small so-add-btn" onclick="addShooter('black')">+ SHOOTER</button>
      </div>
    </div>

  </div>

  <!-- UNOBTRUSIVE FOOTER WITH TEST TOGGLE -->
  <div class="footer-bar">
    <div>REF COMPANION</div>
    <button id="mode-toggle-btn" class="mode-toggle" onclick="toggleMode()">🟡 TEST MODE</button>
    <div>S<span class="display-val" id="season-display"></span> : G<span class="display-val" id="game-display"></span></div>
  </div>

  <!-- LONG PRESS SCORE MODAL -->
  <div id="score-action-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="score-action-title">ADJUST SCORE</h2>
      <button class="btn-modal btn-score-up" onclick="confirmScoreChange(1)">+ 1 GOAL</button>
      <button class="btn-modal btn-final" onclick="confirmScoreChange(-1)">- 1 GOAL</button>
      <button class="btn-modal btn-cancel" onclick="closeScoreModal()">CANCEL</button>
    </div>
  </div>

  <!-- END OF REGULATION POPUP -->
  <div id="end-game-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>END OF REGULATION</h2>
      <p>Is this game going to Overtime, a Shootout, or is it Final?</p>
      <button class="btn-modal btn-ot" onclick="setPostGame('OT')">OVERTIME</button>
      <button class="btn-modal btn-so" onclick="setPostGame('SO')">SHOOTOUT</button>
      <button class="btn-modal btn-final" onclick="setPostGame('FINAL')">GAME OVER</button>
    </div>
  </div>

  <!-- SHOOTOUT CHOICE POPUP -->
  <div id="so-choice-modal" class="modal-overlay">
    <div class="so-choice-box">
      <div class="so-choice-buttons">
        <button class="btn-so-choice btn-so-goal" onclick="applySoChoice('goal')">✓</button>
        <button class="btn-so-choice btn-so-miss" onclick="applySoChoice('miss')">X</button>
      </div>
      <button class="btn-so-clear" onclick="applySoChoice('clear')">CLEAR CIRCLE</button>
    </div>
  </div>

  <script>
    // Prevent default context menu (copy/paste popups) on long presses on mobile
    document.addEventListener('contextmenu', event => event.preventDefault());

    // --- YOUR GOOGLE SCRIPT URL ---
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyIOR9a1TsTk-NsxccwZdgNxmOPu_w7YWge9aEovUxCFXzWif3xsDQuLfT1DDbklQVm8g/exec';

    // --- STATE VARIABLES ---
    let goalEvents = [];       
    let pendingSyncGoals = []; 
    let currentPeriod = 1;
    let activeSoCircle = null;
    let isLiveMode = false; // defaults to testing!
    
    // Timer Variables (Atomic Date.now() logic)
    let startingMinutes = 20; 
    let totalSeconds = startingMinutes * 60; // used for display math when paused
    let expectedEndTime = 0; // exact atomic timestamp of when it hits 0
    let timerInterval = null;
    let isRunning = false;

    // --- AUTO-CALCULATE SEASON & GAME ---
    let autoSeason = 5;
    let autoGame = 8;
    
    function calculateGameNumber() {
      const refDate = new Date(2026, 6, 24); 
      const now = new Date();
      const diffTime = now.getTime() - refDate.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays > 0) {
        autoGame = 8 + Math.floor(diffDays / 7);
      }
      
      document.getElementById('season-display').innerText = autoSeason;
      document.getElementById('game-display').innerText = autoGame;
    }
    calculateGameNumber();

    // --- TEST MODE TOGGLE LOGIC ---
    function toggleMode() {
      isLiveMode = !isLiveMode;
      const btn = document.getElementById('mode-toggle-btn');
      if(isLiveMode) {
        btn.innerText = "🔴 LIVE GAME";
        btn.classList.add('mode-live');
      } else {
        btn.innerText = "🟡 TEST MODE";
        btn.classList.remove('mode-live');
      }
    }

    // --- LONG PRESS SCORE UI ---
    let pressTimer;
    let targetTeamForScore = null;

    function startPress(e, team) {
      if (currentPeriod === 5 || currentPeriod === 6) return; // Disabled in Shootout/Final
      pressTimer = setTimeout(() => {
        openScoreModal(team);
      }, 500); // 0.5 seconds long press
    }

    function cancelPress() {
      clearTimeout(pressTimer);
    }

    function openScoreModal(team) {
      targetTeamForScore = team;
      document.getElementById('score-action-title').innerText = (team === 'white' ? 'WHITE' : 'BLACK') + " TEAM SCORE";
      document.getElementById('score-action-modal').style.display = 'flex';
    }

    function closeScoreModal() {
      document.getElementById('score-action-modal').style.display = 'none';
      targetTeamForScore = null;
    }

    function confirmScoreChange(amount) {
      if(targetTeamForScore) {
        changeScore(targetTeamForScore, amount);
      }
      closeScoreModal();
    }

    // --- SCORE & SILENT SYNC LOGIC ---
    function changeScore(team, amount) {
      if (amount === 1) {
        let newGoal = {
          id: Date.now(),
          team: team,
          period: currentPeriod,
          time: document.getElementById('time-display').innerText
        };
        
        goalEvents.push(newGoal);
        pendingSyncGoals.push(newGoal);

        setTimeout(() => {
          triggerSilentSync(newGoal.id);
        }, 30000); 

      } else if (amount === -1) {
        for (let i = goalEvents.length - 1; i >= 0; i--) {
          if (goalEvents[i].team === team) {
            let removedGoal = goalEvents.splice(i, 1)[0];
            pendingSyncGoals = pendingSyncGoals.filter(g => g.id !== removedGoal.id);
            break;
          }
        }
      }
      
      let whiteScore = goalEvents.filter(e => e.team === 'white').length;
      let blackScore = goalEvents.filter(e => e.team === 'black').length;
      
      document.getElementById('white-score').innerText = whiteScore;
      document.getElementById('black-score').innerText = blackScore;
    }

    function triggerSilentSync(goalId) {
      // Do not sync if testing mode is active!
      if (!isLiveMode) {
        console.log("TEST MODE: Blocked syncing to Google Sheets.");
        return;
      }

      const goalIndex = pendingSyncGoals.findIndex(g => g.id === goalId);
      
      if (goalIndex > -1) {
        const goalToSync = pendingSyncGoals.splice(goalIndex, 1)[0];
        const payload = {
          secretToken: "BanhMiHockey2026!",
          season: autoSeason,
          game: autoGame,
          events: [goalToSync] 
        };

        fetch(scriptURL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        }).catch(error => console.error("Sync failed:", error));
      }
    }

    // --- PERIOD LOGIC ---
    function changePeriod(amount) {
      if (isRunning) return;
      currentPeriod += amount;
      if (currentPeriod < 1) currentPeriod = 1;
      if (currentPeriod > 6) currentPeriod = 6;
      
      let display = "PERIOD " + currentPeriod;
      if (currentPeriod === 4) display = "OVERTIME";
      if (currentPeriod === 5) display = "SHOOTOUT";
      if (currentPeriod === 6) display = "FINAL";
      
      document.getElementById('period-display').innerText = display;
      updateShootoutUI();
    }

    function handlePeriodEnd() {
      // End the clock instantly
      clearInterval(timerInterval);
      isRunning = false;
      totalSeconds = 0; // Display 00:00
      updateTimerDisplay();
      
      const btn = document.getElementById('start-stop-btn');
      btn.innerText = "START";
      btn.style.backgroundColor = "#28a745";
      
      const setupBtns = [
        document.getElementById('reset-btn'),
        document.getElementById('period-minus-btn'),
        document.getElementById('period-plus-btn'),
        document.getElementById('time-minus-btn'),
        document.getElementById('time-plus-btn'),
        document.getElementById('end-period-btn')
      ];
      setupBtns.forEach(el => el.style.opacity = "1"); 

      // If Period 3 ends, prompt OT/SO/End Game modal
      if (currentPeriod === 3) {
        document.getElementById('end-game-modal').style.display = 'flex';
      } else if (currentPeriod < 3) {
        changePeriod(1);
        resetTimer();
      }
    }

    function setPostGame(choice) {
      document.getElementById('end-game-modal').style.display = 'none';
      
      if (choice === 'OT') {
        currentPeriod = 4;
        document.getElementById('period-display').innerText = "OVERTIME";
        startingMinutes = 5; 
      } else if (choice === 'SO') {
        currentPeriod = 5;
        document.getElementById('period-display').innerText = "SHOOTOUT";
        startingMinutes = 0; 
      } else if (choice === 'FINAL') {
        currentPeriod = 6;
        document.getElementById('period-display').innerText = "FINAL";
        startingMinutes = 0; 
      }
      
      totalSeconds = startingMinutes * 60;
      updateTimerDisplay();
      updateShootoutUI();
    }

    // --- SHOOTOUT UI LOGIC ---
    function openSoChoice(el) {
      activeSoCircle = el;
      document.getElementById('so-choice-modal').style.display = 'flex';
    }

    function applySoChoice(result) {
      if (!activeSoCircle) return;
      activeSoCircle.classList.remove('so-goal', 'so-miss');
      activeSoCircle.innerText = "";
      if (result === 'goal') {
        activeSoCircle.classList.add('so-goal');
        activeSoCircle.innerText = "✓";
      } else if (result === 'miss') {
        activeSoCircle.classList.add('so-miss');
        activeSoCircle.innerText = "X";
      }
      document.getElementById('so-choice-modal').style.display = 'none';
      activeSoCircle = null;
    }

    function addShooter(team) {
      const ticker = document.getElementById(team + '-ticker');
      const newCircle = document.createElement('div');
      newCircle.className = 'so-circle';
      newCircle.onclick = function() { openSoChoice(this); };
      ticker.appendChild(newCircle);
    }

    function updateShootoutUI() {
      const isShootout = (currentPeriod === 5);
      const isFinal = (currentPeriod === 6);
      
      document.getElementById('white-score-box').style.display = isShootout ? 'none' : 'flex';
      document.getElementById('black-score-box').style.display = isShootout ? 'none' : 'flex';

      document.getElementById('white-so-container').style.display = isShootout ? 'flex' : 'none';
      document.getElementById('black-so-container').style.display = isShootout ? 'flex' : 'none';

      if (isShootout) {
        document.getElementById('timer-wrapper-section').style.display = 'none';
        document.getElementById('timer-controls-section').style.display = 'none';
        document.getElementById('so-end-btn').style.display = 'block';
      } else if (isFinal) {
        document.getElementById('timer-wrapper-section').style.display = 'none';
        document.getElementById('timer-controls-section').style.display = 'none';
        document.getElementById('so-end-btn').style.display = 'none';
      } else {
        document.getElementById('timer-wrapper-section').style.display = 'flex';
        document.getElementById('timer-controls-section').style.display = 'flex';
        document.getElementById('so-end-btn').style.display = 'none';
      }
    }

    function endShootoutGame() {
      let shootoutEvents = [];
      let whiteGoals = 0;
      let blackGoals = 0;

      const whiteCircles = document.querySelectorAll('#white-ticker .so-circle');
      whiteCircles.forEach((c, idx) => {
        if (c.classList.contains('so-goal') || c.classList.contains('so-miss')) {
          const isGoal = c.classList.contains('so-goal');
          if (isGoal) whiteGoals++;
          shootoutEvents.push({ shooter: "WHITE", goalie: "BLACK", time: "SO Shot " + (idx + 1), score: isGoal ? "GOAL" : "MISS" });
        }
      });

      const blackCircles = document.querySelectorAll('#black-ticker .so-circle');
      blackCircles.forEach((c, idx) => {
        if (c.classList.contains('so-goal') || c.classList.contains('so-miss')) {
          const isGoal = c.classList.contains('so-goal');
          if (isGoal) blackGoals++;
          shootoutEvents.push({ shooter: "BLACK", goalie: "WHITE", time: "SO Shot " + (idx + 1), score: isGoal ? "GOAL" : "MISS" });
        }
      });

      // Send to sheets ONLY if in Live Mode
      if (shootoutEvents.length > 0 && isLiveMode) {
        fetch(scriptURL, {
          method: 'POST',
          body: JSON.stringify({
            secretToken: "BanhMiHockey2026!",
            type: "shootout",
            season: autoSeason,
            game: autoGame,
            shootoutEvents: shootoutEvents
          }),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });
      }

      let finalWhite = goalEvents.filter(e => e.team === 'white').length;
      let finalBlack = goalEvents.filter(e => e.team === 'black').length;
      if (whiteGoals > blackGoals) finalWhite++;
      else if (blackGoals > whiteGoals) finalBlack++;

      document.getElementById('white-score').innerText = finalWhite;
      document.getElementById('black-score').innerText = finalBlack;

      currentPeriod = 6;
      document.getElementById('period-display').innerText = "FINAL";
      updateShootoutUI();
    }

    // --- ACCURATE ATOMIC TIMER LOGIC ---
    function updateTimerDisplay() {
      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;
      let displayString = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
      document.getElementById('time-display').innerText = displayString;
    }
    
    function adjustTime(amount) {
      if (isRunning) return;
      startingMinutes += amount;
      if (startingMinutes < 1) startingMinutes = 1;
      if (startingMinutes > 60) startingMinutes = 60;
      totalSeconds = startingMinutes * 60;
      updateTimerDisplay();
    }

    function toggleTimer() {
      const btn = document.getElementById('start-stop-btn');
      const setupBtns = [
        document.getElementById('reset-btn'),
        document.getElementById('period-minus-btn'),
        document.getElementById('period-plus-btn'),
        document.getElementById('time-minus-btn'),
        document.getElementById('time-plus-btn'),
        document.getElementById('end-period-btn')
      ];
      
      if (isRunning) {
        // Pause Action
        isRunning = false;
        clearInterval(timerInterval);
        
        // Lock in remaining time
        let now = Date.now();
        let remaining = expectedEndTime - now;
        totalSeconds = Math.max(0, Math.ceil(remaining / 1000));
        updateTimerDisplay();

        btn.innerText = "START";
        btn.style.backgroundColor = "#28a745"; 
        setupBtns.forEach(el => el.style.opacity = "1");
      } else {
        // Start Action
        isRunning = true;
        
        // Calculate atomic end time from exactly right now
        expectedEndTime = Date.now() + (totalSeconds * 1000);
        
        btn.innerText = "PAUSE";
        btn.style.backgroundColor = "#d1122a"; 
        setupBtns.forEach(el => el.style.opacity = "0.3");
        
        // Rapid check to keep display smooth without losing time
        timerInterval = setInterval(() => {
          let now = Date.now();
          let delta = expectedEndTime - now;
          
          if (delta <= 0) {
            handlePeriodEnd();
          } else {
            totalSeconds = Math.ceil(delta / 1000);
            updateTimerDisplay();
          }
        }, 200); 
      }
    }

    function resetTimer() {
      if (isRunning) return;
      clearInterval(timerInterval);
      isRunning = false;
      totalSeconds = startingMinutes * 60; 
      const btn = document.getElementById('start-stop-btn');
      btn.innerText = "START";
      btn.style.backgroundColor = "#28a745";
      updateTimerDisplay();
    }

    // Init display
    updateShootoutUI();

    // --- SCREEN WAKE LOCK (PREVENT PHONE FROM SLEEPING) ---
    let wakeLock = null;

    const requestWakeLock = async () => {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Screen Wake Lock active! Phone will not sleep.');
          
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            console.log('Screen Wake Lock released.');
          });
        }
      } catch (err) {
        console.error(`Wake Lock failed: ${err.message}`);
      }
    };

    // Re-request wake lock if the ref switches apps and comes back
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    // Request wake lock on the very first tap/click anywhere on the screen
    document.addEventListener('pointerdown', () => {
      if (!wakeLock) {
        requestWakeLock();
      }
    });
  </script>
</body>
